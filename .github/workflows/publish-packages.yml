name: publish-packages
run-name: ${{ github.workflow }} (${{ inputs.ref || 'dev' }})

# Builds the five FreedomNAS packages, the community modules
# (freedomnas-module-<id>, from each module's dev branch or its own newest
# vX.Y.Z tag) and the ports under ports/ (Pi-hole) inside FreeBSD's own VM
# image (ci/build-in-vm.sh, through freedomnas-builder's QEMU driver, with
# KVM), and publishes the signed catalogue as the release
# pkg-<major>-<group> of this repository (bin/publish-github.sh).
#
# ref dev builds every component at dev, as snapshots, into pkg-15-dev;
# ref main builds the newest release tag (vX.Y.Z) into pkg-15-main.
#
# Started by gather-pushes ten minutes after the last push to a component,
# every day as a safety net, or by hand.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch of the component repositories to build (dev or main)"
        type: string
        default: dev
  schedule:
    - cron: "57 4 * * *"

permissions:
  contents: write

concurrency:
  group: publish-packages-${{ inputs.ref || 'dev' }}
  cancel-in-progress: false

env:
  REF: ${{ inputs.ref || 'dev' }}
  GROUP: ${{ inputs.ref == 'main' && 'main' || 'dev' }}
  MAJOR: "15"
  FREEBSD_RELEASE: 15.1-RELEASE
  ORG_URL: https://github.com/FreedomNAS

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Install the host tools
        timeout-minutes: 10
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|' /etc/apt/sources.list.d/ubuntu.sources
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          $apt update
          $apt install -y qemu-system-x86 qemu-utils xorriso xz-utils curl python3
          ls -l /dev/kvm

      - name: Pick the ref to build
        run: |
          case "$REF" in dev|main) ;; *) echo "ref must be dev or main, not $REF" >&2; exit 1 ;; esac
          ref="$REF"
          if [ "$ref" = main ]; then
            ref="$(git ls-remote --tags --refs "$ORG_URL/freedomnas-core.git" 'v*' \
              | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -n 1)"
            [ -n "$ref" ] || { echo "no release tag on freedomnas-core" >&2; exit 1; }
            echo "SNAPSHOT=" >> "$GITHUB_ENV"
          else
            echo "SNAPSHOT=1" >> "$GITHUB_ENV"
          fi
          echo "Building $ref"
          echo "SRC_REF=$ref" >> "$GITHUB_ENV"

      - name: Check out freedomnas-freebsd
        uses: actions/checkout@v4
        with:
          path: freedomnas-freebsd

      # build-in-vm.sh looks for the builder beside this checkout under its
      # old name.
      - name: Check out freedomnas-builder
        run: git clone --depth 1 --branch dev "$ORG_URL/freedomnas-builder.git" freedomnas-image-builder

      - name: Check out the components
        run: |
          for repo in freedomnas-profiles freedomnas-core freedomnas-docs freedomnas-webui freedomnas-installer; do
            git clone --depth 50 --branch "$SRC_REF" "$ORG_URL/$repo.git" "$repo"
          done

      - name: Check out the community modules
        run: |
          modules=""
          for repo in freedomnas-containers freedomnas-proxy; do
            url="$ORG_URL/$repo.git"
            ref=dev
            if [ "$GROUP" = main ]; then
              ref="$(git ls-remote --tags --refs "$url" 'v*' \
                | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -n 1)"
              [ -n "$ref" ] || { echo "$repo has no release tag yet: not built for main"; continue; }
            fi
            echo "Building $repo at $ref"
            git clone --depth 50 --branch "$ref" "$url" "$repo"
            modules="$modules $repo"
          done
          echo "MODULES=$modules" >> "$GITHUB_ENV"

      - name: Keep FreeBSD's VM image between runs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/freebsd-cache
          key: freebsd-vm-${{ env.FREEBSD_RELEASE }}

      - name: Build in the FreeBSD VM
        env:
          FREEBSD_SIGNING_KEY: ${{ secrets.FREEBSD_SIGNING_KEY }}
        run: |
          [ -n "$FREEBSD_SIGNING_KEY" ] || { echo "the FREEBSD_SIGNING_KEY secret is not set" >&2; exit 1; }
          key="$RUNNER_TEMP/freedomnas-freebsd.key"
          ( umask 077 && printf '%s\n' "$FREEBSD_SIGNING_KEY" > "$key" )
          sudo env SNAPSHOT="$SNAPSHOT" MODULES="$MODULES" SIGNING_KEY="$key" FREEBSD_RELEASE="$FREEBSD_RELEASE" \
              FNAS_CACHE_DIR="$RUNNER_TEMP/freebsd-cache" QEMU_SCREENDUMP="$RUNNER_TEMP/vm-screen.ppm" \
            sh freedomnas-freebsd/ci/build-in-vm.sh "$PWD/out"
          rm -f "$key"
          sudo chown -R "$(id -u):$(id -g)" out "$RUNNER_TEMP/freebsd-cache"

      - name: Keep the VM screen of a timed-out build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vm-screen
          path: ${{ runner.temp }}/vm-screen.ppm
          if-no-files-found: ignore

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh freedomnas-freebsd/bin/publish-github.sh "$PWD/out"
